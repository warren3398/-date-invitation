<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Date Invitation ❤️</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(145deg,#fff0f5,#ffd2df,#ffb3ca);color:#6d1834}
.card{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,620px);padding:clamp(28px,7vw,55px) 18px;text-align:center;background:#ffffffe6;border-radius:30px;box-shadow:0 20px 60px #8d24452e}
.icon{font-size:clamp(60px,16vw,95px)}h1{font-size:clamp(29px,7vw,47px);line-height:1.08;margin:12px 0}p{font-size:clamp(16px,4vw,20px);color:#9a4962}
.row{display:flex;justify-content:center;align-items:center;gap:14px;flex-wrap:wrap;min-height:70px;margin-top:24px}
button{border:0;border-radius:999px;padding:15px 25px;font-size:18px;font-weight:800;min-width:120px;cursor:pointer;touch-action:manipulation;box-shadow:0 8px 20px #6d183424}
.yes,.choice{background:#ff3f73;color:white}.no{background:white;color:#a63858;border:2px solid #ffc0d1;z-index:10}
.choice{min-width:170px}.hidden{display:none!important}
.floating{position:fixed!important;margin:0!important}
.heart{position:fixed;bottom:-50px;pointer-events:none;animation:fly linear forwards}@keyframes fly{to{transform:translateY(-120vh) rotate(35deg);opacity:0}}
</style></head><body>
<section class="card" id="page1"><div class="icon">💌</div><h1>Will you go on a date with me? ❤️</h1><p>I promise it'll be worth saying yes. 🌷</p>
<div class="row"><button class="yes" id="yes">YES 💖</button><button class="no" id="no">NO 🙈</button></div></section>

<section class="card hidden" id="page2"><div class="icon">🥰</div><h1>What kind of date? ❤️</h1><p>Pili ka ng adventure natin ✨</p>
<div class="row"><button class="choice" onclick="finish('Camping')">🏕️ CAMPING</button><button class="choice" onclick="finish('Staycation')">🏨 STAYCATION</button></div></section>

<section class="card hidden" id="page3"><div class="icon">💖</div><h1 id="finalTitle">It's a date! 🥰</h1><p id="finalText"></p><div style="font-size:40px">🌹✨💕✨🌹</div></section>

<script>
var yes=document.getElementById("yes"), no=document.getElementById("no"), noCount=0;
yes.onclick=function(){
 document.getElementById("page1").classList.add("hidden");
 no.classList.add("hidden");
 document.getElementById("page2").classList.remove("hidden"); hearts(15);
};
function moveNo(){
 noCount++;
 var scale=Math.max(.35,1-noCount*.10);
 no.style.transform="scale("+scale+")";
 no.classList.add("floating");
 var w=no.offsetWidth*scale,h=no.offsetHeight*scale,pad=10;
 no.style.left=(pad+Math.random()*Math.max(1,innerWidth-w-pad*2))+"px";
 no.style.top=(pad+Math.random()*Math.max(1,innerHeight-h-pad*2))+"px";
}
no.addEventListener("click",function(e){e.preventDefault();moveNo()});
no.addEventListener("touchstart",function(e){e.preventDefault();moveNo()},{passive:false});
no.addEventListener("mouseenter",moveNo);
function finish(x){
 document.getElementById("page2").classList.add("hidden");
 document.getElementById("page3").classList.remove("hidden");
 document.getElementById("finalText").textContent=x==="Camping"?"Camping it is! 🏕️🔥 Adventure date confirmed. ❤️":"Staycation it is! 🏨✨ Relaxing date confirmed. ❤️";
 hearts(35);
}
function hearts(n){for(let i=0;i<n;i++)setTimeout(function(){var h=document.createElement("div");h.className="heart";h.textContent=["❤️","💕","💖","🌸"][Math.floor(Math.random()*4)];h.style.left=Math.random()*100+"vw";h.style.fontSize=(18+Math.random()*24)+"px";h.style.animationDuration=(2.5+Math.random()*2.5)+"s";document.body.appendChild(h);setTimeout(()=>h.remove(),5200)},i*70)}
</script></body></html>
