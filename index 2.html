<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Date Invitation ❤️</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100svh;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;background:linear-gradient(145deg,#fff0f5,#ffd2df,#ffb3ca);color:#6d1834}.card{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,620px);padding:clamp(28px,7vw,52px) 18px;text-align:center;background:#fffffff0;border-radius:30px;box-shadow:0 20px 60px #8d24452e;z-index:2}.icon{font-size:70px}h1{font-size:clamp(28px,7vw,46px);margin:12px 0}p{font-size:18px;color:#9a4962}.row{display:flex;justify-content:center;align-items:center;gap:16px;flex-wrap:wrap;min-height:90px}button{border:0;border-radius:999px;padding:15px 25px;font-size:18px;font-weight:800;min-width:120px;touch-action:manipulation;box-shadow:0 8px 20px #6d183424}#yes,.choice{background:#ff3f73;color:#fff}#yes{transition:transform .2s;transform-origin:center}#no{background:#fff;color:#a63858;border:2px solid #ffc0d1;transition:transform .2s}.note{min-height:32px;font-weight:800;color:#c33560}.hidden{display:none!important}.choice{min-width:165px}.final{padding:10px}.final img{width:100%;max-height:82svh;object-fit:contain;border-radius:22px}.confetti{position:fixed;top:-25px;z-index:99;pointer-events:none;animation:fall linear forwards}@keyframes fall{to{transform:translate3d(var(--d),110vh,0) rotate(900deg);opacity:.9}}</style></head>
<body><section class="card" id="p1"><div class="icon">💌</div><h1>Will you go on a date with me? ❤️</h1><p>I promise it'll be worth saying yes. 🌷</p><div class="row"><button id="yes">YES 💖</button><button id="no">NO 🙈</button></div><div class="note" id="note"></div></section>
<section class="card hidden" id="p2"><div class="icon">🥰</div><h1>What kind of date? ❤️</h1><p>Choose our adventure ✨</p><div class="row"><button class="choice" onclick="finish('camping')">🏕️ CAMPING</button><button class="choice" onclick="finish('staycation')">🏨 STAYCATION</button></div></section>
<section class="card final hidden" id="p3"><div class="icon" id="finalIcon"></div><h1 id="finalTitle"></h1><p id="finalText"></p></section>
<script>const yes=document.getElementById('yes'),no=document.getElementById('no'),note=document.getElementById('note');let n=0;const notes=['Are you sure? 🥺','Really sure? 😭','Think about it again… 💗','Sure na sure? 👀','Last chance! 🥹','YES is looking pretty good now 😏'];function shrink(e){e.preventDefault();n++;note.textContent=notes[Math.min(n-1,notes.length-1)];no.style.transform='scale('+Math.max(.3,1-n*.11)+')';yes.style.transform='scale('+Math.min(1.65,1+n*.1)+')'}no.addEventListener('click',shrink);no.addEventListener('touchstart',shrink,{passive:false});yes.onclick=()=>{p1.classList.add('hidden');p2.classList.remove('hidden');confetti(150)};function finish(x){p2.classList.add('hidden');p3.classList.remove('hidden');finalIcon.textContent=x==='camping'?'🏕️':'🏨';finalTitle.textContent=x==='camping'?'Camping Confirmed! ❤️':'Staycation Confirmed! ❤️';finalText.textContent=x==='camping'?'Adventure accepted! Same skies. New stories. 🔥':'Relaxing date accepted! Time for new memories. ✨';confetti(100)}function confetti(q){let cs=['#ff3f73','#ffd166','#06d6a0','#4cc9f0','#9b5de5','#fff'];for(let i=0;i<q;i++){let c=document.createElement('i');c.className='confetti';c.style.left=Math.random()*100+'vw';c.style.background=cs[Math.floor(Math.random()*cs.length)];c.style.width=6+Math.random()*8+'px';c.style.height=8+Math.random()*15+'px';c.style.setProperty('--d',-120+Math.random()*240+'px');c.style.animationDuration=1.8+Math.random()*2.5+'s';c.style.animationDelay=Math.random()*.35+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),5000)}}</script></body></html>
